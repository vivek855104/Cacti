<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Azure Bay Resort</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2a251c;--mute:#7b6f5b;--line:rgba(120,98,52,.18);--gold:#b8913f;--gold2:#8f6d24;--gold-soft:rgba(201,162,74,.55);
  --onaccent:#fffdf6;--hover:rgba(255,252,244,.55);--sel:rgba(255,252,246,.78);
  --g-bg:rgba(250,247,240,.84);--g-bd:rgba(255,255,255,.6);
  --g-sh:0 14px 44px rgba(52,38,14,.16),0 1px 2px rgba(52,38,14,.1);--blur:20px;
  --f-disp:"Fraunces",Georgia,serif;--f-ui:"Inter",system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);--t:.38s;
  --pw:372px;--pr:calc(var(--pw) + 36px);--ph:46vh;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@supports(height:1dvh){:root{--ph:46dvh}}
/* the interface follows the scene: when the slider reaches night the glass turns smoky and warm */
body.night{--ink:#f2e9d7;--mute:#bba98a;--line:rgba(232,200,120,.16);--gold:#e0bd6c;--gold2:#a8842f;--onaccent:#1a150c;
  --hover:rgba(255,236,190,.07);--sel:rgba(255,236,190,.13);
  --g-bg:rgba(26,22,15,.8);--g-bd:rgba(232,200,120,.22);--g-sh:0 14px 44px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{--g-bg:rgba(250,247,240,.97)}body.night{--g-bg:rgba(26,22,15,.96)}}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;height:100%;overflow:hidden;background:#0a0c0d;color:var(--ink);font-family:var(--f-ui);
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.glass{background:var(--g-bg);border:1px solid var(--g-bd);box-shadow:var(--g-sh);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(1.15);backdrop-filter:blur(var(--blur)) saturate(1.15);
  transition:background .6s,border-color .6s,color .6s}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ── stage: the 3D scene is the whole screen ── */
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#labels{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
#topbar{display:flex;gap:10px;align-items:flex-start;margin:calc(env(safe-area-inset-top,0px) + 16px) 18px 0;pointer-events:none}
#topbar>*,#views>*{pointer-events:auto}

/* ── wayfinding labels ── */
.lbl{position:absolute;transform:translate(-50%,calc(-100% - 12px));pointer-events:auto;border:1px solid rgba(255,255,255,.55);
  border-radius:9px;padding:5px 13px 6px;background:rgba(251,247,238,.8);color:#2b2418;text-align:center;
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
  box-shadow:0 1px 2px rgba(70,50,16,.14),0 6px 18px rgba(70,50,16,.12);cursor:pointer;white-space:nowrap;
  transition:transform .25s var(--ease),box-shadow .25s,background .5s,color .5s,border-color .25s,opacity .9s}
.lbl:before{content:"";position:absolute;left:14px;right:14px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-soft),transparent)}
.lbl:after{content:"";position:absolute;left:50%;top:100%;width:1px;height:11px;background:linear-gradient(var(--gold-soft),transparent)}
.lbl b{display:block;font-family:var(--f-disp);font-weight:400;font-size:13px;letter-spacing:.012em}
.lbl span{display:block;margin-top:1px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#8a7650}
.lbl:hover,.lbl.on{transform:translate(-50%,calc(-100% - 12px)) scale(1.05);border-color:var(--gold-soft);background:rgba(255,252,245,.94);
  box-shadow:0 2px 3px rgba(70,50,16,.2),0 10px 26px rgba(70,50,16,.18)}
body.night .lbl{background:rgba(26,21,14,.74);color:#f3e8cf;border-color:rgba(232,200,120,.22)}
body.night .lbl span{color:#c9b68c}
body.night .lbl:hover,body.night .lbl.on{background:rgba(36,29,19,.92)}
body.intro .lbl{opacity:0;pointer-events:none}

/* ── brand, back, time of day ── */
#back{display:none;align-items:center;gap:6px;height:44px;padding:0 15px 0 11px;border-radius:14px;cursor:pointer;
  font:500 12.5px var(--f-ui);letter-spacing:.03em;color:var(--ink)}
#back svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#crest{position:relative;padding:9px 20px 10px 18px;border-radius:14px;font-family:var(--f-disp);font-size:19px;line-height:1.1;
  letter-spacing:.01em;color:var(--ink)}
#crest:before{content:"";position:absolute;left:18px;right:18px;top:-1px;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
#crest span{display:block;margin-top:4px;font:500 9.5px var(--f-ui);letter-spacing:.24em;color:var(--mute)}
#tod{margin-left:auto;padding:8px 15px 9px;border-radius:16px;display:flex;flex-direction:column;gap:5px;align-items:stretch}
#tod-label{font:500 9.5px var(--f-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--gold2);text-align:center}
body.night #tod-label{color:var(--gold)}
#tod .row{display:flex;align-items:center;gap:10px}
#tod svg{flex:none;width:15px;height:15px;fill:none;stroke:var(--mute);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#tod input{-webkit-appearance:none;appearance:none;width:clamp(96px,13vw,148px);height:4px;border-radius:2px;margin:0;
  background:linear-gradient(90deg,#8fd0ee,#f6c58f 50%,#26346a);cursor:pointer;outline:none}
#tod input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;border:2px solid #fffdf6;
  background:linear-gradient(160deg,var(--gold),var(--gold2));box-shadow:0 1px 5px rgba(0,0,0,.3)}
#tod input::-moz-range-thumb{width:14px;height:14px;border-radius:50%;border:2px solid #fffdf6;
  background:linear-gradient(160deg,var(--gold),var(--gold2));box-shadow:0 1px 5px rgba(0,0,0,.3)}
#tod input:focus-visible{outline:2px solid var(--gold);outline-offset:6px}

/* ── room viewpoints: a floating toolbar, centred in the clear part of the screen ── */
#views{display:flex;gap:4px;justify-content:flex-start;align-self:center;margin:0 var(--pr) calc(env(safe-area-inset-bottom,0px) + 20px) 0;
  padding:5px;border-radius:16px;max-width:calc(100vw - var(--pr) - 24px);overflow-x:auto;scrollbar-width:none}
#views:empty{display:none}
#views>:first-child{margin-left:auto}#views>:last-child{margin-right:auto}
#views::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:11px;padding:10px 16px;background:transparent;color:var(--ink);cursor:pointer;
  font:500 12.5px var(--f-ui);letter-spacing:.05em;min-height:40px;transition:background .3s var(--ease),color .3s,transform .2s}
.chip:hover{background:var(--hover)}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{background:linear-gradient(160deg,var(--gold),var(--gold2));color:var(--onaccent);box-shadow:0 2px 10px rgba(143,109,36,.35)}

/* ── information panel: frosted glass floating over the scene ── */
#panel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 84px);right:18px;bottom:18px;width:var(--pw);z-index:3;border-radius:20px;
  display:flex;flex-direction:column;overflow:hidden;
  transition:transform .5s var(--ease),opacity .4s var(--ease),background .6s,border-color .6s}
body.min #panel{transform:translateX(calc(100% + 30px));opacity:0;pointer-events:none}
#pbar{flex:none;display:flex;align-items:center;gap:8px;padding:12px 12px 8px 22px;border-bottom:1px solid var(--line)}
#ptitle{flex:1;font:500 10px var(--f-ui);letter-spacing:.22em;text-transform:uppercase;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pclose{width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:10px;background:transparent;cursor:pointer;color:var(--mute);transition:background .25s,color .25s}
#pclose:hover{background:var(--hover);color:var(--ink)}
#pclose svg,#popen svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#grab{display:none}
#pc{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px 22px 26px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#pc.in{animation:rise .5s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#popen{position:fixed;top:calc(env(safe-area-inset-top,0px) + 84px);right:18px;z-index:3;display:none;align-items:center;gap:8px;
  height:44px;padding:0 16px 0 14px;border-radius:14px;cursor:pointer;font:500 12.5px var(--f-ui);letter-spacing:.06em;color:var(--ink)}
body.min #popen{display:flex}
body.min #popen{animation:rise .5s var(--ease)}

/* panel content */
#pc h1{font:400 38px/1.05 var(--f-disp);letter-spacing:-.012em;margin:16px 0 0}
#pc .sub{margin-top:9px;font:500 10.5px var(--f-ui);letter-spacing:.26em;color:var(--mute);text-transform:uppercase}
#pc .rule{width:44px;height:1px;margin:16px 0 16px;background:linear-gradient(90deg,var(--gold),transparent)}
#pc .tag{font:italic 400 17px/1.35 var(--f-disp);margin:0 0 8px;color:var(--ink)}
#pc p{margin:0 0 12px;line-height:1.62;font-size:13.5px;color:var(--mute);max-width:56ch}
#pc h2{font:600 10px var(--f-ui);letter-spacing:.24em;color:var(--gold2);margin:26px 0 8px;text-transform:uppercase}
body.night #pc h2{color:var(--gold)}
.crumb{display:inline-flex;align-items:center;gap:6px;margin:12px 0 0 -6px;padding:6px 10px 6px 6px;border:0;border-radius:9px;background:transparent;
  font:500 11.5px var(--f-ui);letter-spacing:.06em;color:var(--mute);cursor:pointer;transition:background .25s,color .25s}
.crumb:hover{background:var(--hover);color:var(--ink)}
.crumb svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.stay{list-style:none;margin:0;padding:0}
.stay li+li{border-top:1px solid var(--line)}
.item{position:relative;display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:13px 10px 13px 12px;border:0;border-radius:12px;
  background:transparent;cursor:pointer;transition:background .3s var(--ease),transform .3s var(--ease)}
.item .mark{flex:none;width:2px;height:30px;border-radius:2px;background:var(--line);transition:background .3s,height .3s var(--ease)}
.item .txt{flex:1;min-width:0}
.item b{display:block;font:400 17px/1.2 var(--f-disp);color:var(--ink)}
.item small{display:block;margin-top:3px;font-size:12px;line-height:1.35;color:var(--mute)}
.item .meta{flex:none;font:500 11px var(--f-ui);letter-spacing:.06em;color:var(--mute);text-align:right;white-space:nowrap}
.item .meta .stars{display:block;margin-top:2px;letter-spacing:1px}
.item .go{flex:none;width:15px;height:15px;fill:none;stroke:var(--gold);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;
  opacity:0;transform:translateX(-5px);transition:opacity .3s,transform .3s var(--ease)}
.item:hover,.item.on,.item:focus-visible{background:var(--sel);transform:translateX(2px)}
.item:hover .mark,.item.on .mark,.item:focus-visible .mark{background:var(--gold);height:38px}
.item:hover .go,.item.on .go,.item:focus-visible .go{opacity:1;transform:none}
.stars{color:var(--gold);font-size:11px;letter-spacing:2px}
.rate{display:flex;flex-wrap:wrap;gap:4px 9px;align-items:baseline;margin:14px 0 14px;font-size:12.5px;color:var(--mute)}
.rate b{color:var(--ink);font-weight:600;font-size:13.5px}
.facts{display:grid;grid-template-columns:1fr 1fr;margin:4px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{padding:12px 0 12px 0}
.facts div:nth-child(odd){padding-right:12px;border-right:1px solid var(--line)}
.facts div:nth-child(even){padding-left:16px}
.facts div:nth-child(n+3){border-top:1px solid var(--line)}
.facts dt{font:500 9.5px var(--f-ui);letter-spacing:.2em;color:var(--mute);text-transform:uppercase;margin:0 0 4px}
.facts dd{margin:0;font-size:13.5px;line-height:1.3;color:var(--ink)}
ul.am{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}
ul.am li{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12.5px;color:var(--ink)}
ul.am svg{flex:none;width:15px;height:15px;fill:none;stroke:var(--gold);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.rev{padding:12px 0;border-top:1px solid var(--line)}
.rev:first-of-type{border-top:0;padding-top:2px}
.rev p{margin:4px 0 0;font-size:13px}
.rev b{font-size:12.5px;font-weight:600}
.tariff{display:flex;align-items:baseline;gap:8px;margin:22px 0 0;padding-top:16px;border-top:1px solid var(--line)}
.tariff b{font:400 30px var(--f-disp)}
.tariff span{font-size:12.5px;color:var(--mute)}
.book{width:100%;margin-top:14px;border:0;border-radius:12px;padding:14px;background:linear-gradient(160deg,var(--gold),var(--gold2));
  box-shadow:0 4px 16px rgba(143,109,36,.3);color:var(--onaccent);font:600 13px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;
  cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s}
.book:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(143,109,36,.38)}
.book:active{transform:scale(.99)}
.book:disabled{opacity:.65;cursor:default;transform:none}

/* ── loading and fallback ── */
#fade{position:fixed;inset:0;background:#07090a;opacity:0;pointer-events:none;transition:opacity .45s;z-index:5}
#load{position:fixed;inset:0;z-index:9;background:#0c0e0f;color:#e8e4da;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;transition:opacity .7s}
#load h3{font:400 25px var(--f-disp);margin:0}
#bar{width:min(240px,60vw);height:2px;background:rgba(255,255,255,.16);overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a6520,#e8c878);transition:width .3s}
#load small{font-size:12px;letter-spacing:.08em;color:#8a8d87;min-height:1.2em}
#oops{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;
  padding:28px;text-align:center;background:#0c0e0f;color:#e8e4da;font-size:15px;line-height:1.6}

/* ── tablet: a slimmer panel keeps more of the resort in view ── */
@media(min-width:860px) and (max-width:1100px){:root{--pw:320px}#pc h1{font-size:32px}}
/* ── phones: the scene fills the width and the information rises as a bottom sheet ── */
@media(max-width:859px){
  :root{--pr:0px}
  #stage{bottom:var(--ph);transition:bottom .4s var(--ease)}
  #topbar{margin:calc(env(safe-area-inset-top,0px) + 12px) 12px 0}
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;height:var(--ph);border-radius:20px 20px 0 0;border-bottom:0;
    transition:height .4s var(--ease),background .6s;padding-bottom:env(safe-area-inset-bottom,0px)}
  body.min #panel{transform:none;opacity:1;pointer-events:auto}
  body.min{--ph:64px}
  #popen{display:none!important}
  #pclose{display:none}
  #grab{display:block;position:absolute;left:0;right:0;top:0;height:22px;border:0;background:transparent;cursor:pointer}
  #grab:after{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 0}
  #pbar{padding-top:22px;padding-left:20px}
  #pc{padding:4px 18px 22px}
  #views{margin:0 0 12px;max-width:calc(100vw - 20px)}
  #pc h1{font-size:30px;margin-top:10px}
}
@media(max-width:520px){#tod-label{display:none}#tod{padding:9px 12px;flex:none}#tod input{width:64px}#tod .row{gap:7px}
  #back span{display:none}#back{padding:0 11px;flex:none}
  #crest{min-width:0;flex:1 1 auto;font-size:15.5px;padding:8px 13px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #crest span{font-size:8.5px;letter-spacing:.18em;overflow:hidden;text-overflow:ellipsis}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#pc .crumb+.sub{margin-top:14px}
#pc .sub+h1{margin-top:8px}
</style>
</head>
<body>
<div id="stage">
  <div id="labels"></div>
  <div id="hud">
    <div id="topbar">
      <button id="back" class="glass" aria-label="Back"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg><span>Back</span></button>
      <div id="crest" class="glass" aria-live="polite">Azure Bay<span>RESORT &amp; SPA</span></div>
      <div id="tod" class="glass" title="Time of day">
        <div id="tod-label" aria-live="polite">Golden hour</div>
        <div class="row"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg>
        <input id="tod-range" type="range" min="0" max="100" value="50" aria-label="Time of day, from day to night">
        <svg viewBox="0 0 16 16"><path d="M12.5 10.2A5.2 5.2 0 0 1 6 3.5a5.2 5.2 0 1 0 6.5 6.7z"/></svg></div>
      </div>
    </div>
    <div id="views" class="glass" role="toolbar" aria-label="Room viewpoints"></div>
  </div>
</div>
<aside id="panel" class="glass" aria-label="Resort information">
  <button id="grab" aria-label="Expand or collapse details"></button>
  <div id="pbar"><span id="ptitle">Accommodation</span>
    <button id="pclose" aria-label="Collapse information panel" aria-expanded="true"><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></button></div>
  <div id="pc"></div>
</aside>
<button id="popen" class="glass" aria-label="Show accommodation panel"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg><span>Stay</span></button>
<div id="fade"></div>
<div id="load"><h3>Arriving at Azure Bay</h3><div id="bar"><i></i></div><small id="lmsg">starting</small></div>
<div id="oops">This needs WebGL, which this browser has turned off.</div>

<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RectAreaLightUniformsLib} from 'three/addons/lights/RectAreaLightUniformsLib.js';
import {mergeGeometries,mergeVertices} from 'three/addons/utils/BufferGeometryUtils.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {Reflector} from 'three/addons/objects/Reflector.js';

/* ═══════════════ data ═══════════════ */
const TYPES={
  deluxe:{name:'Deluxe Room',price:8500,size:'32 m²',bed:'King',view:'Pool and sea',sleeps:'2 adults, 1 child',rating:4.5,count:218,
    accent:0x1a4e4a, sheen:0x8fd8cc,
    desc:'Thirty-two square metres facing the water, with a private balcony, a deep rain shower and a bed built for the kind of sleep you came here for.',
    am:['Private balcony','Rain shower','Air conditioning','Fast Wi-Fi','Smart TV','Writing desk','Minibar','Tea and coffee'],
    rev:[['Aarav M.',5,'Spotless and quiet. Sitting on the balcony at sunrise was the best part of the trip.'],
         ['Neha S.',4,'Comfortable bed and a serious shower. Wi-Fi held up for a full day of calls.'],
         ['Rohan K.',5,'Housekeeping left fresh tea every afternoon without being asked.']]},
  suite:{name:'Lake Suite',price:14500,size:'48 m²',bed:'King + lounge',view:'Lake',sleeps:'2 adults, 1 child',rating:4.7,count:164,
    accent:0x27406e, sheen:0x9db6e8,
    desc:'A separate lounge, a soaking tub and a balcony wide enough to eat breakfast on, looking straight down the lake.',
    am:['Lounge area','Soaking tub','Nespresso','Butler on call','Air conditioning','Fast Wi-Fi','Smart TV','Walk-in robe'],

function cnv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h||w;

    const x0=((ix%g)+g)%g,y0=((iy%g)+g)%g,x1=(x0+1)%g,y1=(y0+1)%g;
    let tx=fx-ix,ty=fy-iy;tx=tx*tx*(3-2*tx);ty=ty*ty*(3-2*ty);

const rbox=(w,h,d,r)=>new RoundedBoxGeometry(w,h,d,2,Math.min(r===undefined?.008:r,Math.min(w,h,d)/2.02));
function put(geo,mat,x,y,z,parent,shadow){

  m.castShadow=shadow!==false;m.receiveShadow=true;parent.add(m);return m;}
function bx(w,h,d,x,y,z,mat,parent,r,shadow){return put(rbox(w,h,d,r),mat,x,y,z,parent,shadow);}

function plane(w,h,x,y,z,mat,parent,rx,ry){

function crumple(mesh,amp,freq,seed){
  const g=mesh.geometry,p=g.attributes.position,n=fbm(seed||5,6,3);
  for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    if(y>0){p.setY(i,y+(n((x*freq+4)%1,(z*freq+4)%1)-.5)*amp);}}
  p.needsUpdate=true;g.computeVertexNormals();}
function instance(geo,mat,xforms,parent,shadow,colors){
  const im=new THREE.InstancedMesh(geo,mat,xforms.length);
  const d=new THREE.Object3D();
  xforms.forEach((t,i)=>{d.position.set(t[0],t[1],t[2]);
    d.rotation.set(t[3]||0,t[4]||0,t[5]||0);
    const s=t[6]===undefined?1:t[6];d.scale.set(s,t[7]===undefined?s:t[7],t[8]===undefined?s:t[8]);
    d.updateMatrix();im.setMatrixAt(i,d.matrix);
    if(colors) im.setColorAt(i,colors[i]);});
  im.instanceMatrix.needsUpdate=true;
  if(im.instanceColor) im.instanceColor.needsUpdate=true;
  im.castShadow=shadow!==false;im.receiveShadow=true;parent.add(im);return im;}

function palmGeos(){
  /* curved tapered trunk built ring by ring along a leaning curve */
  const P=t=>new THREE.Vector3(Math.pow(t,2.1)*1.15, t*7.3, Math.pow(t,2.1)*0.30);
  const S=16, R=10, pos=[], nor=[], uv=[], idx=[];
  for(let i=0;i<=S;i++){
    const t=i/S, c=P(t), rad=.30*(1-t*.60);
    const c2=P(Math.min(1,t+.02)), tan=c2.clone().sub(c).normalize();
    let nx=new THREE.Vector3().crossVectors(tan,new THREE.Vector3(0,1,0));
    if(nx.lengthSq()<1e-6) nx.set(1,0,0);
    nx.normalize();
    const nz=new THREE.Vector3().crossVectors(tan,nx).normalize();
    for(let j=0;j<=R;j++){
      const a=j/R*Math.PI*2;
      const d=nx.clone().multiplyScalar(Math.cos(a)).addScaledVector(nz,Math.sin(a));
      const ring=rad*(1+.09*Math.sin(t*26)+.05*Math.sin(a*3));
      const p=c.clone().addScaledVector(d,ring);
      pos.push(p.x,p.y,p.z); nor.push(d.x,d.y,d.z); uv.push(j/R,t*5);
    }
  }
  for(let i=0;i<S;i++)for(let j=0;j<R;j++){
    const a=i*(R+1)+j, b=a+R+1;
    idx.push(a,b,a+1, b,b+1,a+1);
  }
  const trunk=new THREE.BufferGeometry();
  trunk.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  trunk.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  trunk.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  trunk.setIndex(idx);

  /* one frond: a drooping V-section blade with a ribbed edge */
  function frond(len,droop){
    const N=18, p=[], u=[], ix=[];
    for(let i=0;i<=N;i++){
      const t=i/N, x=t*len;
      const y=-Math.pow(t,2.0)*droop;
      const w=Math.sin(Math.pow(t,.72)*Math.PI)*.46+.015;
      const notch=1-.16*Math.abs(Math.sin(t*Math.PI*9));
      const ww=w*notch, lift=Math.pow(t,1.4)*.1;
      p.push(x,y,-ww);        u.push(t,0);
      p.push(x,y+lift+.06,0); u.push(t,.5);
      p.push(x,y,ww);         u.push(t,1);
    }
    for(let i=0;i<N;i++){
      const a=i*3, b=(i+1)*3;
      ix.push(a,b,a+1, b,b+1,a+1, a+1,b+1,a+2, b+1,b+2,a+2);
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
    g.setAttribute('uv',new THREE.Float32BufferAttribute(u,2));
    g.setIndex(ix); g.computeVertexNormals();
    return g;
  }
  const top=P(1), fronds=[];
  for(let k=0;k<13;k++){
    const a=k/13*Math.PI*2+.21;
    const young=k%3===0;
    const g=frond(young?2.9:3.7, young?.85:1.75);
    g.rotateZ(young?.42:.16);
    g.rotateY(a);
    g.translate(top.x,top.y-.1,top.z);
    fronds.push(g);
  }
  // coconut cluster and crown shaft
  const nuts=[];
  for(let k=0;k<5;k++){
    const a=k/5*Math.PI*2, s=new THREE.SphereGeometry(.14,8,6);
    s.translate(top.x+Math.cos(a)*.3, top.y-.42, top.z+Math.sin(a)*.3);
    nuts.push(s);
  }
  const crown=new THREE.ConeGeometry(.34,.8,9);
  crown.translate(top.x,top.y-.18,top.z);
  fronds.push(crown,...nuts);
  return {trunk,leaf:mergeGeometries(fronds,false)};
}

const wobN=fbm(3,3,2);
function wob(g,amp){const p=g.attributes.position;
  for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    const k=1+(wobN(x*.31+7,z*.31+7)-.5)*amp+Math.sin(y*6+x*4)*.025;
    p.setXYZ(i,x*k,y,z*k);}
  g.computeVertexNormals();return g;}

/* clump of curved blades: narrow for ornamental grass, broad for tropical foliage */
function bladeClump(n,len,wid,bend,seed,lvl){
  const r=rng(seed),pos=[],nor=[],idx=[];
  for(let b=0;b<n;b++){
    const a=r()*6.283,h=len*(.6+r()*.4),rad=.03+r()*.09,ca=Math.cos(a),sa=Math.sin(a);
    const tx=-sa,tz=ca,w=wid*(.8+r()*.4),bd=bend*(.6+r()*.8),base=pos.length/3;
    for(let k=0;k<=lvl;k++){
      const t=k/lvl,o=rad+bd*t*t,y=h*t*(1-.15*t*t);
      const ww=w*(.12+.88*Math.pow(Math.sin(Math.PI*Math.pow(t,.75)),.8)),cx=ca*o,cz=sa*o;
      pos.push(cx-tx*ww,y,cz-tz*ww, cx+tx*ww,y,cz+tz*ww);
      const nl=Math.hypot(ca*.35,1,sa*.35);
      for(let q=0;q<2;q++)nor.push(ca*.35/nl,1/nl,sa*.35/nl);}
    for(let k=0;k<lvl;k++){const i=base+k*2;idx.push(i,i+1,i+2,i+1,i+3,i+2);}}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  g.setIndex(idx);return g;}

/* flat plane with an optional rectangular hole [w,d,cx,cz], so the pool can really be a hole */
function slab(w,d,cx,cz,y,mat,parent,hole){
  const sh=new THREE.Shape();
  sh.moveTo(-w/2,-d/2);sh.lineTo(w/2,-d/2);sh.lineTo(w/2,d/2);sh.lineTo(-w/2,d/2);sh.closePath();
  if(hole){const hw=hole[0]/2,hd=hole[1]/2,hx=hole[2]-cx,hy=-(hole[3]-cz),p=new THREE.Path();
    p.moveTo(hx-hw,hy-hd);p.lineTo(hx-hw,hy+hd);p.lineTo(hx+hw,hy+hd);p.lineTo(hx+hw,hy-hd);p.closePath();
    sh.holes.push(p);}
  const g=new THREE.ShapeGeometry(sh),p=g.attributes.position,uv=g.attributes.uv;
  for(let i=0;i<p.count;i++)uv.setXY(i,p.getX(i)/w+.5,p.getY(i)/d+.5);
  const m=new THREE.Mesh(g,mat);m.rotation.x=-Math.PI/2;m.position.set(cx,y,cz);
  m.receiveShadow=true;parent.add(m);return m;}
/* clone of a tiled material whose texture repeat matches a real size in metres */
function scaled(mat,w,d,cell){
  const m=mat.clone();
  ['map','normalMap','roughnessMap'].forEach(k=>{if(mat[k]){
    m[k]=mat[k].clone();m[k].repeat.set(w/cell,d/cell);m[k].needsUpdate=true;}});
  return m;}

/* ═══════════════ landscaping: beds, islands, allee and a far tree belt ═══════════════ */
function gardenKit(S,Y,seed){
  const r=rng(seed||21),D=LOW?.6:1,PI=Math.PI;
  const pick=a=>a[(r()*a.length)|0],C=h=>new THREE.Color(h);
  const EM=[0x1d7a46,0x2a8f4f,0x34a057,0x3d8f3a].map(C),LI=[0x86c441,0x9acd4a,0x6fb83f,0xa6d44f].map(C),
        TR=[0x1f8a4c,0x2c9a52,0x3aa65a].map(C),PG=[0x3c9a3e,0x4fa83f,0x2f8a46,0x5aaa3c].map(C),
        FL=[0xfbf7ee,0xfbf7ee,0xfbf7ee,0xff7d62,0xff7d62,0xb9a2ee,0xb9a2ee,0xf06ca8].map(C);
  const A={shrub:[],shrubC:[],bloom:[],bloomC:[],grass:[],grassC:[],trop:[],tropC:[],palm:[],palmC:[],
    round:[],roundC:[],flat:[],flatC:[],cyp:[],cypC:[],rock:[],edge:[],mulch:[],disc:[],up:[]};
  const T6=(x,y,z,s)=>[x,y,z,0,r()*6.283,0,s,s*(.85+r()*.3),s];
  const shrub=(x,z,s,fl)=>{const t=T6(x,Y+.05,z,s);A.shrub.push(t);A.shrubC.push(pick(r()<.6?EM:LI));
    if(fl){A.bloom.push(t);A.bloomC.push(pick(FL));}};
  const grass=(x,z,s)=>{A.grass.push(T6(x,Y+.05,z,s));A.grassC.push(pick(LI));};
  const trop=(x,z,s)=>{A.trop.push(T6(x,Y+.05,z,s));A.tropC.push(pick(TR));};
  const palm=(x,z,s,up)=>{s*=.82;A.palm.push([x,Y,z,0,r()*6.283,0,s,s*(.92+r()*.16),s]);A.palmC.push(pick(PG));
    if(up)A.up.push([x+.55,Y+.06,z+.3]);};
  const tree=(k,x,z,s)=>{A[k].push([x,Y,z,0,r()*6.283,0,s*(.9+r()*.2),s*(.9+r()*.25),s*(.9+r()*.2)]);
    A[k+'C'].push(pick(k==='cyp'?EM:EM.concat(LI.slice(0,2))));};
  const rock=(x,z,s)=>A.rock.push([x,Y+.04,z,r()*.4,r()*6.283,r()*.4,s*(1+r()*.5),s*(.6+r()*.3),s]);
  const edge=(x,z,len,ry)=>A.edge.push([x,Y+.12,z,0,ry,0,len,1,1]);

  function rectBed(x0,x1,z0,z1,o){o=o||{};
    const cx=(x0+x1)/2,cz=(z0+z1)/2,w=x1-x0,d=z1-z0,mx=o.max||1,sp=o.sp||1.1;
    A.mulch.push([cx,Y+.065,cz,-PI/2,0,0,w,d,1]);
    edge(cx,z0,w,0);edge(cx,z1,w,0);edge(x0,cz,d,PI/2);edge(x1,cz,d,PI/2);
    for(let x=x0+.7;x<=x1-.5;x+=sp)for(let z=z0+.7;z<=z1-.5;z+=sp){
      if(r()>D)continue;
      const px=x+(r()-.5)*sp*.5,pz=z+(r()-.5)*sp*.5,e=Math.min(px-x0,x1-px,pz-z0,z1-pz),q=r();
      if(e<1.1){if(q<.5)grass(px,pz,1.1+r()*.5);else if(q<.82)shrub(px,pz,(.7+r()*.3)*mx,true);
        else shrub(px,pz,(.75+r()*.25)*mx,false);}
      else{if(q<.35)shrub(px,pz,(1+r()*.4)*mx,r()<.7);else if(q<.62)trop(px,pz,(1.1+r()*.5)*mx);
        else grass(px,pz,1.3+r()*.5);}}
    (o.palms||[]).forEach(q=>palm(q[0],q[1],q[2],q[3]));}

  function island(cx,cz,R,center){
    A.disc.push([cx,Y+.065,cz,-PI/2,0,0,R*2,R*2,1]);
    const N=Math.round(R*5);
    for(let i=0;i<N;i++){const a=i/N*PI*2;
      edge(cx+Math.cos(a)*R,cz+Math.sin(a)*R,PI*2*R/N*1.05,Math.atan2(-Math.cos(a),-Math.sin(a)));}
    const ring=(rad,n,fn)=>{for(let i=0;i<n;i++){if(r()>D)continue;const a=i/n*PI*2+r()*.5,q=rad*(.9+r()*.2);
      fn(cx+Math.cos(a)*q,cz+Math.sin(a)*q);}};
    ring(R*.8,Math.round(R*4.2),(x,z)=>{r()<.5?grass(x,z,1.1+r()*.5):shrub(x,z,.7+r()*.25,true);});
    ring(R*.52,Math.round(R*3),(x,z)=>{r()<.45?trop(x,z,1.1+r()*.5):shrub(x,z,1+r()*.35,r()<.7);});
    ring(R*.25,Math.round(R*1.4),(x,z)=>{trop(x,z,1.3+r()*.4);});
    const j=()=>(r()-.5)*.8;
    if(center==='palm')palm(cx+j(),cz+j(),1.05+r()*.3,true);
    else if(center==='palm3'){palm(cx-.7,cz+.2,1.3+r()*.15,true);palm(cx+.8,cz-.3,1.0+r()*.15);palm(cx+.1,cz+.9,.8+r()*.15);}
    else if(center==='round')tree('round',cx,cz,.95+r()*.2);
    else if(center==='flat')tree('flat',cx,cz,.95+r()*.2);
    else trop(cx,cz,1.5);
    if(R>2.8){rock(cx+R*.55,cz-R*.35,.5+r()*.4);rock(cx+R*.62,cz-R*.18,.3+r()*.2);}
  }

  /* emit: one instanced mesh per shape */
  const emitAll=()=>{
  const emit=(geo,mat,list,shadow,cols)=>{if(list.length)instance(geo,mat,list,S,shadow,cols);};
  emit(shrubGeo(),M.shrub,A.shrub,true,A.shrubC);
  emit(bloomGeo(),M.bloom,A.bloom,false,A.bloomC);
  emit(bladeClump(18,.95,.034,.3,31,4),M.grassTuft,A.grass,false,A.grassC);
  emit(bladeClump(9,1.5,.2,.6,47,6),M.tropLeaf,A.trop,false,A.tropC);
  const pg=palmGeos();emit(pg.trunk,M.palmTrunk,A.palm,true);emit(pg.leaf,M.palmLeaf,A.palm,true,A.palmC);
  emit(trunkGeo(.13,.24,3),M.palmTrunk,A.round,true);
  emit(crownGeo([[0,4.2,0,1.7,.9],[1.2,3.7,.4,1.2,.85],[-1.1,3.8,-.5,1.25,.85],[.2,5,-.5,1.1,.85],[-.3,3.6,1.1,1,.8]],2),
    M.crownRound,A.round,true,A.roundC);
  emit(trunkGeo(.12,.22,3.6),M.palmTrunk,A.flat,true);
  emit(crownGeo([[0,4.5,0,1.9,.42],[1.9,4.2,.4,1.4,.4],[-1.8,4.2,-.5,1.5,.4],[.3,4.3,-1.9,1.4,.4],[.2,4.3,1.9,1.35,.4],[0,4.9,0,1.3,.4]],2),
    M.crownFlat,A.flat,true,A.flatC);
  emit(crownGeo([[0,1.2,0,.9,1.6],[0,2.6,0,.8,1.7],[0,4,0,.65,1.7],[0,5.2,0,.45,1.6]],1),M.crownTall,A.cyp,true,A.cypC);
  emit(rockGeo(),M.rock,A.rock,true);
  emit(rbox(1,.28,.34,.07),M.coping,A.edge,false);
  emit(new THREE.PlaneGeometry(1,1),M.mulch,A.mulch,false);
  emit(new THREE.CircleGeometry(.5,36),M.mulch,A.disc,false);
  emit(new THREE.CylinderGeometry(.16,.2,.08,10),M.lampGlow,A.up,false);
  };
  return {r,D,A,rectBed,island,palm,tree,shrub,grass,trop,rock,emit:emitAll};
}

function plantGardens(S){
  const K=gardenKit(S,0),{r,D,rectBed,island,palm,tree,shrub}=K,PI=Math.PI;
  /* pool allee: a clipped row of palms in limestone-edged borders on each side of the terrace */
  rectBed(22.6,25.8,11.5,21.8,{max:.9,palms:[[24.2,13.2,1.05,1],[24.2,17.2,1.25,1],[24.2,21,1.1,1]]});
  rectBed(-25.8,-22.6,11.5,21.8,{max:.9,palms:[[-24.2,13.2,1.2,1],[-24.2,17.2,1.05,1],[-24.2,21,1.25,1]]});
  /* low borders along the wings' lawn faces, below the pergolas */
  rectBed(-39,-23,8.6,10.8,{max:.8});
  rectBed(23,39,8.6,10.8,{max:.8});
  /* reception forecourt borders, flanking the dining and lounge decks */
  rectBed(6.4,21.5,-19.8,-16.2,{palms:[[20.4,-18,1.15,1]]});
  rectBed(-21.5,-6.4,-19.8,-16.2,{palms:[[-20.4,-18,1.1,1]]});
  island(-17.5,-37,3.4,'palm3');island(17.5,-37,3.4,'palm3');
  rectBed(-12,12,-47.6,-44.8,{max:1.2});
  /* behind the wings */
  island(-31,-15,4,'round');island(31,-15,4,'flat');
  /* west and east gardens */
  island(-36.5,23.5,4.3,'palm3');island(-25.8,29.5,3.2,'round');island(-36.2,16.8,2.6,'low');
  island(36.5,23.5,4.3,'flat');island(25.8,29.5,3.2,'low');island(36.2,16.8,2.6,'low');
  /* villas: borders to the front and back, palm islands at the corners */
  rectBed(-16.5,16.5,43.2,45.8,{max:.8});
  rectBed(-15,-2.8,22.4,24.6,{max:.8});rectBed(2.8,15,22.4,24.6,{max:.8});
  island(-20,27,2.4,'low');island(20,27,2.4,'low');island(-20,44,2.4,'low');island(20,44,2.4,'low');
  island(-23,36,3,'low');island(23,36,3,'low');
  /* boardwalk to the beach */
  island(-7.5,68,3,'palm');island(7.5,68,3,'round');island(-9,82,3.2,'palm3');island(9,82,3.2,'palm3');
  /* framing islands at the edge of the grounds */
  island(-47,-6,4.5,'round');island(47,-6,4.5,'flat');island(-47,20,4.5,'flat');island(47,20,4.5,'flat');
  island(-47,42,4.5,'round');island(47,42,4.5,'flat');island(-46,-30,4,'palm3');island(46,-30,4,'palm3');

  /* far tree belt: loose clusters with understorey, never inside the resort proper */
  const inside=(x,z)=>x>-54&&x<54&&z>-54&&z<102;
  const placed=[];
  const near=(x,z,m)=>placed.some(p=>(p[0]-x)*(p[0]-x)+(p[1]-z)*(p[1]-z)<m*m);
  const clusters=LOW?18:28;
  for(let c=0,tries=0;c<clusters&&tries<400;tries++){
    const cx=(r()-.5)*290,cz=-120+r()*215;
    if(inside(cx,cz)||inside(cx*.8,cz*.8))continue;c++;
    const n=5+((r()*5)|0);
    for(let i=0;i<n;i++){
      const a=r()*PI*2,rad=2+r()*7,x=cx+Math.cos(a)*rad,z=cz+Math.sin(a)*rad;
      if(inside(x,z)||z>104||near(x,z,2.6))continue;placed.push([x,z]);
      const q=r(),s=1.05+r()*.7;
      if(q<.4)palm(x,z,s*.95);else if(q<.65)tree('round',x,z,s);else if(q<.88)tree('flat',x,z,s);else tree('cyp',x,z,s*1.1);}
    for(let i=0;i<4;i++){const a=r()*PI*2,rad=3+r()*8,x=cx+Math.cos(a)*rad,z=cz+Math.sin(a)*rad;
      if(inside(x,z)||z>104)continue;shrub(x,z,2+r()*1.6,false);}
  }
  K.emit();
}


function makeWing(b,parent){
  const g=new THREE.Group();g.position.set(...b.pos);g.rotation.y=b.rot||0;
  g.userData.bid=b.id;parent.add(g);
  const wallM=stucco(b.wall,3,2), roofM=b.roofSand?M.roofSlate:M.roofClay;
  const [w,d]=b.foot, fh=b.lobby?4.0:3.3, H=fh*b.floors;

  bx(w,H,d,0,H/2,0,wallM,g,.03);
  // plinth
  bx(w+.5,.5,d+.5,0,.25,0,M.limestone,g,.02);
  bx(w+.1,1.0,d+.1,0,.5,0,M.limestone,g,.02);
  // hipped roof
  const roof=put(new THREE.CylinderGeometry(0,Math.hypot(w,d)/2*1.02,1.9,4,1),roofM,0,H+.95,0,g);
  roof.rotation.y=Math.PI/4;roof.scale.set(1,1,d/w);
  bx(w+1.3,.3,d+1.3,0,H+.14,0,M.coping,g,.02);

  // windows + balconies on both long faces
  const winW=.95,winH=1.5,step=w/b.bays, winG=rbox(winW,winH,.07,.01), frameG=rbox(winW+.14,winH+.14,.06,.01);
  const wins=[],frames=[],bals=[],posts=[],rails=[];
  for(let f=0;f<b.floors;f++){
    const y=f*fh+fh*.52;
    for(let c=0;c<b.bays;c++){
      const x=-w/2+(c+.5)*step;
      for(const s of [1,-1]){
        const z=s*(d/2+.06);
        frames.push([x,y,z-s*.03,0,s<0?Math.PI:0,0]);
        wins.push([x,y,z,0,s<0?Math.PI:0,0]);
        if(s>0&&!b.lobby){
          bals.push([x,f*fh+.16,d/2+.62]);
          rails.push([x,f*fh+.72,d/2+1.18]);
          posts.push([x-.6,f*fh+.5,d/2+1.18]);posts.push([x+.6,f*fh+.5,d/2+1.18]);
        }
      }
    }
  }
  // two windows on each end wall, each with a pair of teak shutters
  const shutters=[];
  for(let f=0;f<b.floors;f++){const y=f*fh+fh*.52;
    [-1,1].forEach(s=>[-d*.24,d*.24].forEach(zc=>{
      const x=s*(w/2+.06),ry=s*Math.PI/2;
      frames.push([x-s*.03,y,zc,0,ry,0]);wins.push([x,y,zc,0,ry,0]);
      [-1,1].forEach(q=>shutters.push([x+s*.02,y,zc+q*(winW/2+.3),0,ry,0]));}));}
  instance(frameG,M.frameWarm,frames,g);
  instance(winG,M.winGlass,wins,g,false);
  instance(rbox(.44,winH,.05,.01),M.teak,shutters,g);
  if(bals.length){
    instance(rbox(step*.86,.14,1.2,.02),b.teakBal?M.teak:M.coping,bals,g);
    instance(rbox(step*.86,.05,.06,.012),M.teak,rails,g);
    instance(rbox(.045,1.0,.045,.006),M.steel,posts,g);
    instance(new THREE.PlaneGeometry(step*.8,.95),M.glass,
      bals.map(q=>[q[0],q[1]+.56,q[2]+.56]),g,false);
  }
  // ground-floor colonnade on the pool face
  const cols=[];for(let c=0;c<=b.bays;c++)cols.push([-w/2+c*step,1.45,d/2+1.45]);
  instance(new THREE.CylinderGeometry(.17,.19,2.9,12),M.coping,cols,g);
  bx(w,.3,.5,0,3.02,d/2+1.45,M.coping,g,.02);
  // teak pergola stepping out from the colonnade over the pool terrace
  if(!b.lobby){
    const pz=d/2+3.6,px=[];for(let c=0;c<=b.bays;c+=2)px.push([-w/2+c*step,1.5,pz]);
    if(b.bays%2)px.push([w/2,1.5,pz]);
    instance(rbox(.18,3,.18,.01),M.teak,px,g);
    bx(w,.18,.2,0,3.05,pz,M.teak,g,.01);
    const rf=[];for(let x=-w/2+.3;x<=w/2;x+=.7)rf.push([x,3.18,d/2+2.55]);
    instance(rbox(.08,.1,2.3,.01),M.teak,rf,g);}
  // entrance canopy
  if(b.lobby){
    bx(7,.26,3.4,0,3.5,d/2+1.7,M.coping,g,.03);
    [-3,3].forEach(x=>cy(.19,3.5,x,1.75,d/2+3.1,M.coping,g,14));
    bx(5.2,2.6,.14,0,1.5,d/2+.08,M.glass,g,.01,false);
    for(let i=0;i<3;i++) bx(.1,2.6,.14,-1.7+i*1.7,1.5,d/2+.1,M.frame,g,.01);
  }
  // signage plate
  bx(2.4,.5,.07,w/2-1.8,fh*.78,d/2+.07,M.brassDark,g,.01);
  return g;
}

  fridge:'<rect x="4" y="2" width="8" height="12" rx="1"/><path d="M4 7h8"/>',
  key:'<circle cx="5.5" cy="8" r="2.5"/><path d="M8 8h6M12 8v2"/>',
  balcony:'<path d="M2 7h12M4 7v6M8 7v6M12 7v6M2 13h12M5 4h6"/>'};
const AMI=[[/wi-?fi/i,'wifi'],[/\btv\b/i,'tv'],[/air con/i,'ac'],[/shower/i,'shower'],[/desk/i,'desk'],[/minibar/i,'fridge'],
  [/tea|coffee|nespresso|chef/i,'cup'],[/tub|plunge|pool/i,'bath'],[/lounge|robe/i,'sofa'],[/pickup/i,'car'],
  [/butler/i,'key'],[/balcony/i,'balcony'],[/garden/i,'leaf']];
const amIcon=a=>{const m=AMI.find(x=>x[0].test(a));
  return `<svg viewBox="0 0 16 16">${IC[m?m[1]:'leaf']}</svg>`;};
const stayItem=b=>`<li><button class="item" data-b="${b.id}"><span class="mark"></span>
  <span class="txt"><b>${b.name}</b><small>${b.sub}</small></span>
  <span class="meta">${b.rooms.length?b.rooms.length+' rooms':'Facilities'}</span>${CHEVR}</button></li>`;

function paint(){
  backBtn.style.display=mode==='resort'?'none':'flex';
  crest.innerHTML = mode==='resort' ? 'Azure Bay<span>RESORT &amp; SPA</span>'
    : mode==='building' ? `${curB.name}<span>AZURE BAY</span>`
    : `${TYPES[curRoom.type].name} ${curRoom.no}<span>${curB.name.toUpperCase()}</span>`;
  ptitle.textContent = mode==='resort' ? 'Accommodation' : mode==='building' ? curB.name : 'Room details';
  viewsEl.innerHTML = mode==='room'
    ? Object.keys(ROOM_VIEWS).map(k=>`<button class="chip" data-v="${k}" aria-pressed="${k==='Entry'}">${k}</button>`).join('')
    : '';
  pc.innerHTML = mode==='resort'?resortPanel():mode==='building'?buildingPanel():roomPanel();
  pc.scrollTop=0;pc.classList.remove('in');void pc.offsetWidth;pc.classList.add('in');
  setHover(null);
}
function resortPanel(){
  return `<h1>Azure Bay</h1><div class="sub">Resort &amp; Spa</div><div class="rule"></div>
  <p class="tag">Forty acres on the water.</p>
  <p>Explore the grounds, discover your accommodation, and step inside to experience your stay.</p>
  <h2>Accommodation</h2><ul class="stay">${BUILDINGS.map(stayItem).join('')}</ul>`;
}
function buildingPanel(){
  const b=curB;
  const list=b.rooms.length
    ? `<ul class="stay">${b.rooms.map(([no,t])=>`<li><button class="item" data-room="${no}"><span class="mark"></span>
        <span class="txt"><b>Room ${no}</b><small>${TYPES[t].name} · ${TYPES[t].view}</small></span>
        <span class="meta">${money(TYPES[t].price)}<span class="stars">${stars(roomRating(no,t))}</span></span>${CHEVR}</button></li>`).join('')}</ul>`
    : `<p>No guest rooms here. Step back out to pick another building.</p>`;
  return `<button class="crumb" data-act="up">${CHEVL}Resort</button>
    <div class="sub">Azure Bay</div><h1>${b.name}</h1><div class="rule"></div><p>${b.desc}</p>
    <h2>${b.rooms.length?'Rooms you can walk into':'What is inside'}</h2>${list}`;
}
function roomPanel(){
  const t=TYPES[curRoom.type], r=roomRating(curRoom.no,curRoom.type);
  return `<button class="crumb" data-act="up">${CHEVL}${curB.name}</button>
  <div class="sub">${curB.name}</div><h1>${t.name} ${curRoom.no}</h1><div class="rule"></div>
  <div class="rate"><span class="stars">${stars(r)}</span><b>${r.toFixed(1)}</b><span>${t.count} guest reviews</span></div>
  <p>${t.desc}</p>
  <dl class="facts">
    <div><dt>Size</dt><dd>${t.size}</dd></div>
    <div><dt>Bed</dt><dd>${t.bed}</dd></div>
    <div><dt>Sleeps</dt><dd>${t.sleeps}</dd></div>
    <div><dt>Outlook</dt><dd>${t.view}</dd></div>
  </dl>
  <h2>Amenities</h2><ul class="am">${t.am.map(a=>`<li>${amIcon(a)}${a}</li>`).join('')}</ul>
  <h2>Guest reviews</h2>
  ${t.rev.map(v=>`<div class="rev"><b>${v[0]}</b> <span class="stars">${stars(v[1])}</span>
    <p>${v[2]}</p></div>`).join('')}
  <div class="tariff"><b>${money(t.price)}</b><span>per night, taxes extra</span></div>
  <button class="book">Request this room</button>`;
}
pc.addEventListener('click',e=>{
  const el=e.target.closest('[data-b],[data-room],[data-act],.book'); if(!el) return;
  if(el.dataset.b) enterBuilding(el.dataset.b);
  else if(el.dataset.room) enterRoom(el.dataset.room);
  else if(el.dataset.act==='up') backBtn.onclick();
  else {el.textContent='Request sent (demo)';el.disabled=true;}
});
viewsEl.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b)gotoView(b.dataset.v);});
const todRange=document.getElementById('tod-range');
todRange.addEventListener('input',()=>applyLight(todRange.value/100));
backBtn.onclick=()=>{ if(mode==='room') exitRoom(); else if(mode==='building') toResort(); };

/* the panel floats over the scene; the 3D view is shifted so the resort stays centred in the clear area */
let shift=0,shiftTo=0,shiftInit=false;
const wide=()=>matchMedia('(min-width:860px)').matches;
function panelShiftPx(){return(wide()&&!document.body.classList.contains('min'))?(panelEl.offsetWidth+36)/2:0;}
function applyShift(){
  if(shift>.2) camera.setViewOffset(VW,VH,shift,0,VW,VH);
  else{shift=0;camera.clearViewOffset();}}
function togglePanel(){
  document.body.classList.toggle('min');
  panelEl.inert=document.body.classList.contains('min')&&wide();
  shiftTo=panelShiftPx();
  document.getElementById('pclose').setAttribute('aria-expanded',String(!document.body.classList.contains('min')));}
['grab','pclose','popen'].forEach(id=>document.getElementById(id).addEventListener('click',togglePanel));

/* hover and selection: list item, label and the building itself light up together */
let hoverId=null;
function setHover(id){
  if(id===hoverId) return; hoverId=id;
  BUILDINGS.forEach(b=>{if(b.el)b.el.classList.toggle('on',b.id===id);});
  pc.querySelectorAll('.item[data-b]').forEach(e=>e.classList.toggle('on',e.dataset.b===id));
  renderer.domElement.style.cursor=(id&&mode==='resort')?'pointer':'';
}
pc.addEventListener('mouseover',e=>{const it=e.target.closest('.item[data-b]');setHover(it?it.dataset.b:null);});
pc.addEventListener('mouseleave',()=>setHover(null));
pc.addEventListener('focusin',e=>{const it=e.target.closest('.item[data-b]');if(it)setHover(it.dataset.b);});
pc.addEventListener('focusout',()=>setHover(null));

/* pick a building under the pointer */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(); let down=null;
const dom=renderer.domElement;
function pickBuilding(e){
  const r=dom.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(BUILDINGS.map(b=>b.group).filter(Boolean),true);
  if(!hits.length) return null;
  let o=hits[0].object;while(o&&!o.userData.bid)o=o.parent;
  return o?o.userData.bid:null;}
dom.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];});
dom.addEventListener('pointerup',e=>{
  if(!down||mode!=='resort'){down=null;return;}
  if(Math.hypot(e.clientX-down[0],e.clientY-down[1])>6){down=null;return;}
  const id=pickBuilding(e); if(id) enterBuilding(id);
  down=null;
});
let moveT=0;
dom.addEventListener('pointermove',e=>{
  if(mode!=='resort'||e.pointerType==='touch'||e.buttons||tween){return;}
  const n=performance.now(); if(n-moveT<80) return; moveT=n;
  setHover(pickBuilding(e));});
dom.addEventListener('pointerleave',()=>setHover(null));
let idle; controls.addEventListener('start',()=>{clearTimeout(idle);controls.autoRotate=false;});
controls.addEventListener('end',()=>{if(mode==='resort'){clearTimeout(idle);
  idle=setTimeout(()=>{if(mode==='resort')controls.autoRotate=true;},7000);}});

/* ═══════════════ resize + loop ═══════════════ */
let VW=1,VH=1;
function resize(){
  VW=stage.clientWidth;VH=stage.clientHeight;
  if(!VW||!VH) return;
  renderer.setSize(VW,VH);camera.aspect=VW/VH;
  shiftTo=panelShiftPx();if(!shiftInit){shift=shiftTo;shiftInit=true;}
  if(shift>.2)camera.setViewOffset(VW,VH,shift,0,VW,VH);else{shift=0;camera.clearViewOffset();}
  camera.updateProjectionMatrix();
  if(composer) composer.setSize(VW,VH);
}
new ResizeObserver(resize).observe(stage);
const v3=new THREE.Vector3(), clock=new THREE.Clock();
let shoreT=0;
function placeLabels(){
  BUILDINGS.forEach(b=>{
    const el=b.el; if(!el) return;
    if(mode!=='resort'){el.style.display='none';return;}
    v3.set(b.pos[0],b.labelY,b.pos[2]).project(camera);
    if(v3.z>1){el.style.display='none';return;}
    el.style.display='block';
    el.style.left=((v3.x+1)/2*VW)+'px';
    el.style.top=((1-v3.y)/2*VH)+'px';
  });
}
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05);
  if(tween){
    tween.k+=dt/tween.dur;
    const k=Math.min(tween.k,1), e=tween.brake?1-Math.pow(1-k,3.4):(k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2);
    camera.position.lerpVectors(tween.p0,tween.p1,e);
    controls.target.lerpVectors(tween.t0,tween.t1,e);
    camera.fov=tween.f0+(tween.f1-tween.f0)*e;camera.updateProjectionMatrix();
    if(k>=1){const d=tween.done;tween=null;controls.enabled=true;if(d)d();}
  }
  if(M.rippleTex){M.rippleTex.offset.x+=dt*.013;M.rippleTex.offset.y+=dt*.009;}
  if(M.causticTex){M.causticTex.offset.x+=dt*.021;M.causticTex.offset.y-=dt*.016;}
  shoreT+=dt;animateShore(shoreT);
  if(Math.abs(shift-shiftTo)>.2){shift+=(shiftTo-shift)*Math.min(1,dt*7);applyShift();}
  else if(shift!==shiftTo){shift=shiftTo;applyShift();}
  BUILDINGS.forEach(b=>{if(!b.ring)return;
    const tgt=mode==='resort'&&hoverId===b.id?.95:(mode==='building'&&curB&&curB.id===b.id?.55:0);
    const m=b.ring.material;m.opacity+=(tgt-m.opacity)*Math.min(1,dt*8);b.ring.visible=m.opacity>.01;});
  controls.update();
  placeLabels();
  if(filmPass) filmPass.uniforms.time.value+=dt;
  if(composer) composer.render(); else renderer.render(active,camera);
}

/* ═══════════════ boot ═══════════════ */
(async function boot(){
  try{
    await step('warming up',.03);
    await buildMaterials();
    await step('laying out the grounds',.76);
    buildResort();
    await step('planting the gardens',.88);
    const pmrem=new THREE.PMREMGenerator(renderer);
    ENV=pmrem.fromScene(new RoomEnvironment(),.04).texture;
    resort.environment=pmrem.fromScene(skyEnvScene(),.02).texture;
    buildComposer(resort);
    applyLight(todK);
    if(location.search.includes('dev')) window.__dbg={camera,controls,THREE,applyLight,enterBuilding,enterRoom,gotoView,get room(){return room;}};
    /* opening shot: the drone starts high and far back over the sea, swoops in fast, brakes onto the beach-side view,
       then the slow orbit takes over */
    const still=matchMedia('(prefers-reduced-motion:reduce)').matches||location.search.includes('nointro');
    if(still){camera.position.set(...RESORT_CAM.p);controls.target.set(...RESORT_CAM.t);limits('resort');}
    else{camera.position.set(60,175,330);camera.fov=54;camera.updateProjectionMatrix();
      controls.target.set(0,0,20);limits('free');document.body.classList.add('intro');}
    resize();paint();
    await step('ready',1);
    loop();
    const l=document.getElementById('load');
    l.style.opacity='0';setTimeout(()=>l.remove(),800);
    if(!still) setTimeout(()=>{
      fly(RESORT_CAM.p,RESORT_CAM.t,3.8,40,()=>{limits('resort');document.body.classList.remove('intro');},true);
      setTimeout(()=>document.body.classList.remove('intro'),8000);},450);

  }catch(err){
    console.error(err);
    const l=document.getElementById('load'); if(l) l.remove();
    const o=document.getElementById('oops');
    o.textContent='Could not build the resort: '+(err&&err.message||err);
    o.style.display='flex';
  }
})();
</script>
</body>
